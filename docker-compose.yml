x-airflow-common: &airflow-common
  image: european-railway-airflow:3.2.2
  build: .
  user: "${AIRFLOW_UID:-50000}:0"
  env_file:
    - infra/lakehouse/.env
  networks:
    - default
    - lakehouse
  environment: &airflow-environment
    PYTHONPATH: /opt/airflow
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: ${S3_BUCKET:-railway}
    ICEBERG_CATALOG_HOST: iceberg-catalog-db
    ICEBERG_CATALOG_PORT: "5432"
    RAILWAY_WORK_DIR: /tmp/railway
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
  volumes: &airflow-volumes
    - ./dags:/opt/airflow/dags
    - ./core:/opt/airflow/core:ro
    - airflow_scratch:/tmp/railway
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully
    airflow-work-init:
      condition: service_completed_successfully

services:
  frontend:
    build: ./frontend
    env_file:
      - infra/lakehouse/.env
    ports:
      - "127.0.0.1:7007:3000"
    environment:
      NUXT_TRINO_URL: http://trino:8080
      NUXT_TRINO_USER: admin
      NUXT_MINIO_ENDPOINT: http://minio:9000
      NUXT_MINIO_BUCKET: ${S3_BUCKET:-railway}
    networks:
      - default
      - lakehouse
    depends_on:
      trino:
        condition: service_healthy
    restart: unless-stopped

  trino:
    image: trinodb/trino:476
    ports:
      - "127.0.0.1:7006:8080"
    env_file:
      - infra/lakehouse/.env
    environment:
      S3_BUCKET: ${S3_BUCKET:-railway}
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog:ro
      - ./infra/trino/jvm.config:/etc/trino/jvm.config:ro
    networks:
      - default
      - lakehouse
    restart: unless-stopped

  airflow-work-init:
    image: european-railway-airflow:3.2.2
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        mkdir -p /tmp/railway &&
        chown ${AIRFLOW_UID:-50000}:0 /tmp/railway &&
        chmod 2775 /tmp/railway
    volumes:
      - airflow_scratch:/tmp/railway
    restart: "no"

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "127.0.0.1:7002:3000"
    environment:
      MB_DB_TYPE: h2
      MB_JETTY_HOST: 0.0.0.0
    volumes:
      - metabase_data:/metabase-data
    restart: unless-stopped

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:7001:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped

volumes:
  postgres_data:
  metabase_data:
  airflow_scratch:

networks:
  lakehouse:
    external: true
    name: railway-lakehouse
